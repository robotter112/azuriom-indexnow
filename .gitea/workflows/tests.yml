name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # The tests only read the repository. Third-party actions are pinned to a commit, never a tag.
    permissions:
      contents: read
    # PHP with the extensions of the tests, Composer and Node. Renewed weekly with security
    # updates and pushed only after every repository passed with it, so not pinned by digest.
    container:
      image: git.fastm.de/max/php-ci:${{ matrix.php }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the tests in a fresh Azuriom
        run: sh tests/ci.sh "$RUNNER_TEMP"
